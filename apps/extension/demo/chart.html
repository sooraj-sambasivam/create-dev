<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly signups chart (Sample)</title><style>
:root{--ink:#1c1f24;--ink2:#5b6370;--line:#dfe3e8;--bg:#f5f6f8;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header span{color:var(--ink2);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
main{max-width:820px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin:0 0 4px}p.sub{color:var(--ink2);margin:0 0 24px}
h2{font-size:18px;margin:32px 0 12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}th{background:#eef0f3;font-size:13px;color:var(--ink2)}
tr:last-child td{border-bottom:0}footer{color:var(--ink2);font-size:12px;text-align:center;margin:40px 0}
</style></head><body><header><b>Sample Analytics</b><span>Sample</span></header><main><h1>Growth report</h1><p class="sub">The chart below is a plain image, so the page has no table or data behind it.</p><img src="weekly-signups.svg" alt="" width="640" height="360" style="display:block;background:#fff;border:1px solid var(--line);border-radius:8px"></main><footer>Sample page for demos. Not a real organization.</footer></body></html>
