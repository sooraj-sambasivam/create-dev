<!doctype html>
<html><head><meta charset="utf-8"><title>sync fixture</title>
<style>
  html,body{margin:0;background:#fafafa;font:600 28px system-ui;user-select:none}
  .t{position:absolute;width:260px;height:230px;box-sizing:border-box;border:3px solid #444;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff}
</style></head><body>
<script>
  // 6 labelled targets in a 3x2 grid: A B C / D E F. Centers at (170+320*col, 155+300*row).
  "ABCDEF".split("").forEach((id, i) => {
    const d = document.createElement("div");
    d.className = "t"; d.id = id; d.dataset.targetId = id; d.setAttribute("aria-label", "Target " + id);
    d.style.left = 40 + (i % 3) * 320 + "px"; d.style.top = 40 + Math.floor(i / 3) * 300 + "px";
    d.textContent = id; document.body.appendChild(d);
  });
</script>
<script src="/sync-bundle.js"></script>
<script src="/harness-page.js"></script>
</body></html>
