<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales share by category - Sheets (Sample)</title><style>
:root{--ink:#1f1f1f;--ink2:#5f6368;--line:#dadce0;--bg:#f8f9fa;--card:#fff;--hdr:#f1f3f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:16px;align-items:center}
header b{font-size:18px;font-weight:500}header span{color:var(--ink2);font-size:12px}
nav{background:var(--card);border-bottom:1px solid var(--line);padding:6px 24px;color:var(--ink2);font-size:13px;display:flex;gap:18px}
main{max-width:760px;margin:40px auto;padding:0 24px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:9px 14px;text-align:left;border:1px solid var(--line);font-size:14px}th{background:var(--hdr);font-weight:600;color:var(--ink2)}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}tfoot td{font-weight:600;background:var(--hdr)}
footer{color:var(--ink2);font-size:12px;text-align:center;margin:40px 0}
</style></head><body><header><b>Sales share by category</b><span>Sample spreadsheet</span></header><nav><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span></nav>
<main><table id="sales"><caption style="text-align:left;font-weight:600;padding:0 0 8px">Category / Sales / % of Total</caption><thead><tr><th>Category</th><th>Sales</th><th>% of Total</th></tr></thead><tbody><tr><td>A</td><td>$100</td><td>9.8%</td></tr><tr><td>B</td><td>$140</td><td>13.7%</td></tr><tr><td>C</td><td>$440</td><td>43.1%</td></tr><tr><td>D</td><td>$340</td><td>33.3%</td></tr></tbody><tfoot><tr><td>Total</td><td>$1,020</td><td>100%</td></tr></tfoot></table></main><footer>Sample page for demos. Not a real organization.</footer></body></html>
